name: ref-check

# Karar referanslarini denetler: belgelerde veya arayuzde anilan her D-XXX
# numarasinin DECISIONS.md'de bir karsiligi olmali.
#
# Neden var: arayuzdeki bulgu kartlari "D-049", "D-045 · D-046 · D-066" basiyordu
# ama o kararlar hic yazilmamisti. Ekran var olmayan kayitlara atif yapiyordu ve
# bunu kod degil, bir insan fark etti. Bu is akisi ayni seyin sessizce
# tekrarlanmasini engelliyor.
#
# Toplayiciya dokunmaz, ag erisimi istemez, saniyeler surer.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ref-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Once denetleyicinin YAKALAYABILDIGINI kanitla. Hicbir seyi yakalamayan
      # bir denetleyici de yesil kalir; o yuzden bu adim asil denetimden once.
      # Her Python dosyasi derlenebiliyor mu? Bu adim her push'ta kosuyor.
      #
      # Neden var: 2026-09-11'de collect.py'ye yarim kalmis bir satir islendi
      # (kirpilmis yapistirma, kapanmamis string). Toplayici 5 kosu boyunca
      # cokerek gecti ve iki gun boyunca hic anlik goruntu alinamadi. Kimse
      # fark etmedi, cunku hicbir sey kirmizi yanmiyordu — zamanlanmis kosu
      # sessizce basarisiz oluyordu.
      #
      # Sozdizimi hatasi en ucuz yakalanan hata turudur; onu bir sonraki
      # zamanlanmis kosuya birakmak en pahali secimdir.
      - name: Python dosyalari derleniyor mu
        run: |
          python -m compileall -q collector scripts
          echo 'butun dosyalar derlendi'

      - name: Denetleyicinin kendi testi
        run: python scripts/ref_check.py --kendi-testi

      # Asili referans varsa cikis 1 -> kosu kirmizi.
      # KAYIT KAYIP yer tutuculari hata degil; sayilir ve loglanir.
      - name: Karar referanslarini denetle
        run: python scripts/ref_check.py --liste
